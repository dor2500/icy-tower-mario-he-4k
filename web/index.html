<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Icy Tower 1.3.1 - מהדורת סופר מריו בעברית, בדפדפן ובטלפון. אותו משחק ואותו עיצוב, ב-HD עד 8K.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Icy Mario">
<title>Icy Tower - מהדורת סופר מריו</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="safe"></div>
<img id="logo" src="assets/hd/TITLE.webp" alt="">

<canvas id="game"></canvas>

<!-- touch controls (shown on phones / tablets) -->
<div id="controls">
  <div class="pad">
    <button class="ctl" data-k="left" aria-label="שמאלה"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
    <button class="ctl" data-k="right" aria-label="ימינה"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
  </div>
  <button class="ctl pause" data-k="pause" aria-label="השהיה"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  <button class="ctl jump" data-k="jump" aria-label="קפיצה"><svg viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></svg><span>קפיצה</span></button>
</div>

<input id="nameInput" maxlength="10" autocomplete="nickname" enterkeyhint="done" hidden aria-label="השם שלך">

<div id="loading">
  <div class="title">ICY TOWER</div>
  <div class="sub">מהדורת סופר מריו</div>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="loadMsg">טוען את המגדל...</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
