; cnc-ddraw (https://github.com/FunkyFr3sh/cnc-ddraw, MIT) settings for Icy Tower - 4K / any resolution.
; The game renders 640x480; cnc-ddraw scales it to the screen with sharp pixels.
; Alt+Enter switches between borderless fullscreen and a normal window.
[ddraw]
; borderless fullscreen at the desktop resolution (e.g. 3840x2160)
fullscreen=true
windowed=true
border=false
; keep the 4:3 picture (black bars on the sides). boxing=true = whole-number scale only (2560x1920 on 4K)
maintas=true
boxing=false
; sharp pixels
renderer=auto
shader=Shaders\nearest-neighbor.glsl
d3d9_filter=0
adjmouse=true
resizable=true
toggle_borderless=true
savesettings=0
screenshotdir=.\Screenshots\
