; cnc-ddraw (https://github.com/FunkyFr3sh/cnc-ddraw, MIT) settings for Icy Tower - HD up to 8K.
; The game renders 640x480; cnc-ddraw scales it to the screen (4K, 8K, anything) on the GPU.
; Alt+Enter switches between borderless fullscreen and a normal window.
[ddraw]
; borderless fullscreen at the desktop resolution (e.g. 3840x2160 or 7680x4320)
fullscreen=true
windowed=true
border=false
; keep the 4:3 picture (black bars on the sides). boxing=true = whole-number scale only
maintas=true
boxing=false
; HD: xBRZ pixel-art upscaling shader (smooth curves, sharp edges - the same look as the HTML version).
; For the original sharp square pixels use:  shader=Shaders\nearest-neighbor.glsl
renderer=opengl
shader=Shaders\xbrz\xbrz-freescale-multipass.glsl
d3d9_filter=0
adjmouse=true
resizable=true
toggle_borderless=true
savesettings=0
screenshotdir=.\Screenshots\
